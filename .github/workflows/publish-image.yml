name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

env:
  IMAGE: europe-west2-docker.pkg.dev/brave-nucleus-424014-n9/limitless-repo/limitless-acp

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.digest.outputs.image_digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/305911314180/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: github-actions-publisher@brave-nucleus-424014-n9.iam.gserviceaccount.com
          token_format: access_token

      - name: Log in to Artifact Registry
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          echo "$ACCESS_TOKEN" | docker login europe-west2-docker.pkg.dev \
            --username oauth2accesstoken --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tags
        id: tags
        run: |
          {
            echo 'tags<<EOF'
            echo "$IMAGE:sha-$GITHUB_SHA"
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then
              echo "$IMAGE:main"
            fi
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "$IMAGE:$GITHUB_REF_NAME"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true

      - name: Record pushed image digest
        id: digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          image_digest="$IMAGE@$DIGEST"
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$image_digest" >> "$GITHUB_STEP_SUMMARY"
